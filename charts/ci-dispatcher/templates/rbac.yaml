apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ci-dispatcher.name" . }}
  labels: {{- include "ci-dispatcher.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Runner pods: create, follow, label and delete. Leases: leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ci-dispatcher.name" . }}
  labels: {{- include "ci-dispatcher.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ci-dispatcher.name" . }}
  labels: {{- include "ci-dispatcher.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "ci-dispatcher.name" . }}}
subjects:
  - kind: ServiceAccount
    name: {{ include "ci-dispatcher.name" . }}
    namespace: {{ .Release.Namespace }}
---
# TokenReview authenticates the runner agents; nodes feed the budget and
# the control-plane check of public pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "ci-dispatcher.name" .) }}
  labels: {{- include "ci-dispatcher.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "ci-dispatcher.name" .) }}
  labels: {{- include "ci-dispatcher.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ printf "%s-%s" .Release.Namespace (include "ci-dispatcher.name" .) }}}
subjects:
  - kind: ServiceAccount
    name: {{ include "ci-dispatcher.name" . }}
    namespace: {{ .Release.Namespace }}
